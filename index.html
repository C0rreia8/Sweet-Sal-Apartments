<style>
body{margin:0;background:#F7F5F0;color:#0E2433;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0E2433}a:hover{color:#127A86}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.stage{position:sticky;top:0;overflow:hidden;width:100%}
.disp{font-family:'Syne',sans-serif;font-weight:700;letter-spacing:-0.035em;line-height:0.92;margin:0}
.ser{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase}
.rv{opacity:0;transform:translateY(48px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}
.wave{position:absolute;left:0;width:200%;animation:drift 18s linear infinite}
.wave.w2{animation-duration:26s;animation-direction:reverse}
.wave.w3{animation-duration:34s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.55}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
@keyframes flagwave{0%,100%{transform:translateY(0) scaleY(1);filter:brightness(1)}50%{transform:translateY(calc(var(--a) * 1px)) scaleY(calc(1 - var(--a) * .006));filter:brightness(.8)}}
.fslice{flex:none;overflow:hidden;height:80px;animation:flagwave 1.7s ease-in-out infinite;transform-origin:50% 50%}
@keyframes cue{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.navlinks{display:flex;gap:34px;align-items:center}
.navlinks a{text-decoration:none;font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;transition:transform .3s,background .3s,color .3s}
.btn:hover{transform:translateY(-2px)}
.word{transition:opacity .25s linear,color .4s}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid rgba(14,36,51,.12)}
.spec{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid rgba(14,36,51,.12);min-width:0}
.spec:nth-child(odd){padding-right:16px;border-right:1px solid rgba(14,36,51,.12)}
.spec:nth-child(even){padding-left:20px}
.spec .ic{width:44px;height:44px;border-radius:50%;background:#EEF6F6;color:#127A86;display:flex;align-items:center;justify-content:center;flex:none}
.spec .num{margin:0;font-family:'Syne',sans-serif;font-weight:800;font-size:24px;line-height:1;letter-spacing:-0.02em;white-space:nowrap}
.spec .lab{margin:6px 0 0;font-size:13px;line-height:1.3;opacity:.72}
.specs.dark,.specs.dark .spec{border-color:rgba(247,245,240,.14)}
.specs.dark .spec .ic{background:rgba(247,245,240,.08);color:var(--sun)}
.word.ser{color:var(--sun);font-size:1.12em}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px;align-items:center}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.apt{display:grid;grid-template-columns:1.25fr 1fr;gap:0}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.gal .big{grid-row:span 2}
.photo{position:relative;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;padding:18px;min-height:150px}
.mapgrid{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:56px;align-items:center;height:100%}
.place{display:flex;align-items:baseline;gap:18px;padding:14px 0;border-bottom:1px solid rgba(14,36,51,.12);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;transition:opacity .4s,padding .4s}
.marker{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #F7F5F0;transition:background .4s,width .4s,height .4s}
.ring{position:absolute;width:14px;height:14px;border-radius:50%;animation:pulse 1.8s ease-out infinite}
.daylist{display:flex;flex-direction:column;gap:6px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.field input,.field select,.field textarea{font-family:inherit;font-size:16px;color:#F7F5F0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:12px;min-height:50px;padding:12px 16px}
.field select option{color:#0E2433}
.field input::placeholder,.field textarea::placeholder{color:rgba(247,245,240,.55)}
.walltitle{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 5vw 8vh;pointer-events:none}
.pol{position:absolute;margin:0;background:#FFFFFF;padding:10px 10px 0;box-shadow:0 22px 40px -20px rgba(14,36,51,.5),0 2px 6px rgba(14,36,51,.08);pointer-events:none;will-change:transform;z-index:3}
.pol img,.pol .ph{display:block;width:100%;aspect-ratio:1 / 1;object-fit:cover}
.pol .ph{background:repeating-linear-gradient(135deg,#EEF6F6 0 10px,#E2EFEF 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#127A86;font-size:11px;font-weight:700;letter-spacing:.04em;text-align:center;padding:10px;box-sizing:border-box}
.pol figcaption{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(15px,1.3vw,22px);color:#0E2433;text-align:center;padding:6px 2px 10px;line-height:1.1}
.pol .tape{position:absolute;top:-11px;left:50%;width:58px;height:22px;margin-left:-29px;background:rgba(233,162,59,.42);transform:rotate(-4deg)}
.hidemob{}
@media (max-width: 960px){
.pol{display:none}
.g2,.apt,.mapgrid{grid-template-columns:minmax(0,1fr);gap:36px}
.g3{grid-template-columns:minmax(0,1fr)}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.navlinks{display:none}
.wrap{padding:0 20px}
.walltitle{flex-direction:column;justify-content:space-between;padding:110px 20px 120px;text-align:center}
.mapside{display:none}
.hidemob{display:none}
}
@media (prefers-reduced-motion: reduce){.wave,.ring{animation:none}.rv{transition:none;opacity:1;transform:none}}
</style>
<noscript><style>.rv{opacity:1;transform:none}</style></noscript>
